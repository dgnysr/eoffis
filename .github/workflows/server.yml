# Richtet das Supabase-Projekt ein bzw. bringt es auf den Stand des Repos (Datenbank, Funktionen, Schlüssel, Anmeldung, täglicher Lauf)
# und prüft danach alles wie ein echter Kunde. Läuft bei Änderungen unter supabase/ und per Knopf „Run workflow“.
# Einmalig nötig: Repository-Secret SUPABASE_ACCESS_TOKEN. Optional: ANTHROPIC_API_KEY, BREVO_API_KEY, MAIL_FROM (Secrets), OPERATOR_EMAIL (Variable).
name: Server einrichten
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/supabase_setup.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: supabase-setup, cancel-in-progress: false }
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Supabase einrichten und prüfen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN fehlt noch – Server-Einrichtung übersprungen"; exit 0; fi
          node scripts/supabase_setup.mjs
      - name: App-Einstellungen (config.js) übernehmen
        if: always() && env.SUPABASE_ACCESS_TOKEN != ''
        env: { SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}' }
        run: |
          git diff --quiet -- config.js && exit 0
          git config user.name "eoffis-bot"; git config user.email "eoffis-bot@users.noreply.github.com"
          (cd src && python3 build_site.py)
          git add config.js index.html eoffis-app.js && git commit -m "Server eingerichtet: Push-Schlüssel und Freigabe-Links aktiv" && git pull --rebase && git push
