<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://lqohxlxemawzrtdqjnci.supabase.co blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>eOffis – Belege abrufen</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --bg: #f4f2ee; --card: #fff; --ink: #1d2422; --muted: #66706c; --accent: #1f6f5c; --warn: #b4442c; --line: #e2ddd4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151a19; --card: #1f2624; --ink: #ecefed; --muted: #9aa5a1; --accent: #5cc0a3; --warn: #f08a70; --line: #2f3835; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  input { width: 100%; font-size: 1.6rem; letter-spacing: .3em; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); margin: 12px 0; }
  button, a.btn { display: block; width: 100%; text-align: center; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .6; }
  .err { color: var(--warn); font-weight: 600; }
  .brand { font-weight: 800; color: var(--accent); margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <div class="brand">eOffis</div>
  <div class="card" id="box">
    <h1>Belege abrufen</h1>
    <p class="muted">Diese Belege wurden Ihnen verschlüsselt freigegeben. Bitte geben Sie den 6-stelligen Code ein, den Sie getrennt erhalten haben.</p>
    <form id="f"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" aria-label="Code" required>
    <button id="go" type="submit">Öffnen</button></form>
    <p id="msg" class="muted" role="status"></p>
  </div>
  <p class="muted" style="margin-top:16px">Die Dateien werden erst in Ihrem Browser entschlüsselt. Weder eOffis noch der Server können sie lesen.</p>
</main>
<script src="config.js"></script>
<script src="freigabe.js"></script>
</body>
</html>
