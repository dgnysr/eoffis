<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: iOS-Muster – große Titel, gruppierte Listen, Tab-Leiste mit mittigem Scan-Knopf; DATEV-artig nüchtern: weiß/grau, ein ruhiges Grün als einzige Akzentfarbe. */
:root {
  --paper: #f2f3f5;
  --sheet: #ffffff;
  --ink: #15191e;
  --muted: #646d78;
  --line: #dfe2e6;
  --accent: #1d7348;
  --accent-ink: #ffffff;
  --accent-soft: #e5f1ea;
  --stamp: #c0392b;
  --warn: #b85c00;
  --caution: #8a7300;
  --ok: #1d7348;
  --shadow: 0 1px 2px rgba(21, 25, 30, .06), 0 8px 24px rgba(21, 25, 30, .08);
  --f-display: -apple-system, BlinkMacSystemFont, "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Atkinson Hyperlegible", "Segoe UI", "Noto Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #000000; --sheet: #1c1c1e; --ink: #f2f2f4; --muted: #9a9ca3; --line: #333438;
    --accent: #4cc283; --accent-ink: #062314; --accent-soft: #15301f; --stamp: #ff6b5e;
    --warn: #ffa64d; --caution: #e3c94e; --ok: #4cc283;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #000000; --sheet: #1c1c1e; --ink: #f2f2f4; --muted: #9a9ca3; --line: #333438;
  --accent: #4cc283; --accent-ink: #062314; --accent-soft: #15301f; --stamp: #ff6b5e;
  --warn: #ffa64d; --caution: #e3c94e; --ok: #4cc283;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.55rem; font-weight: 700; }
.big-title { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 1.18rem; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .86em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 58px; }
.top h1 { flex: 1; min-width: 0; font-size: 1.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; color: var(--accent); letter-spacing: -.02em; }
.back { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 10px; min-width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer; }
[dir="rtl"] .back { transform: scaleX(-1); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 120px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--sheet); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: .76rem; font-weight: 700; cursor: pointer; min-height: 60px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .grid2.stack { grid-template-columns: 1fr; } }

.btn { border: 1px solid transparent; border-radius: 12px; min-height: 52px; padding: 10px 16px; font-weight: 700; font-size: 1rem; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.sec { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.danger { background: var(--stamp); color: #fff; }
.btn.sm { min-height: 42px; padding: 6px 12px; font-size: .92rem; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .item:focus-visible, .back:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.full { width: 100%; }
.btn svg { width: 22px; height: 22px; flex: none; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-height: 104px; text-align: start; cursor: pointer;
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 1.02rem; }
.tile svg { width: 28px; height: 28px; color: var(--accent); }
.tile.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tile.primary svg { color: var(--accent-ink); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; cursor: pointer; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.6rem; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .74rem; color: var(--muted); font-weight: 700; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; font-weight: 700; color: var(--muted); }
input.in, textarea.in, select.in { width: 100%; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 1.02rem; color: var(--ink); font-weight: 400; }
textarea.in { min-height: 96px; resize: vertical; }
input.in:focus, textarea.in:focus, select.in:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input.in[readonly], textarea.in[readonly] { background: var(--paper); }
.check { display: flex; align-items: center; gap: 12px; padding: 6px 0; cursor: pointer; font-weight: 400; color: var(--ink); font-size: 1rem; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: .9rem; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip.quiet { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }

.list { display: flex; flex-direction: column; gap: 8px; }
.item { position: relative; display: flex; gap: 12px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px 13px 18px; cursor: pointer; text-align: start; width: 100%; overflow: hidden; }
.item::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 5px; background: var(--sev, transparent); }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.item .s { font-size: .86rem; color: var(--muted); overflow-wrap: anywhere; }
.item .r { margin-inline-start: auto; font-weight: 700; font-size: .9rem; color: var(--sev, var(--muted)); text-align: end; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item > div:first-child { min-width: 0; flex: 1; }

.banner { border-radius: 12px; padding: 12px 14px; font-size: .95rem; background: var(--accent-soft); color: var(--accent); }
.banner.warn { background: color-mix(in srgb, var(--warn) 14%, var(--sheet)); color: var(--warn); }
.banner.stamp { background: color-mix(in srgb, var(--stamp) 12%, var(--sheet)); color: var(--stamp); }

.sev-red { --sev: var(--stamp); } .sev-orange { --sev: var(--warn); } .sev-yellow { --sev: var(--caution); } .sev-green { --sev: var(--ok); } .sev-grey { --sev: var(--line); }
.c-red { color: var(--stamp); } .c-orange { color: var(--warn); } .c-yellow { color: var(--caution); } .c-green { color: var(--ok); } .c-grey { color: var(--muted); }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.thumb { aspect-ratio: 210/297; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; cursor: pointer; padding: 0; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb span { position: absolute; inset-inline-start: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: .72rem; border-radius: 4px; padding: 1px 5px; }

.part { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.part .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.ib { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-weight: 800; color: var(--accent); flex: none; }
.ib[disabled] { opacity: .3; cursor: default; }
.meter { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }

.crop { position: relative; touch-action: none; user-select: none; background: #000; border-radius: 10px; overflow: hidden; max-width: 100%; }
.crop canvas { display: block; width: 100%; height: auto; }
.crop .frame { position: absolute; border: 3px solid #ffd54f; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); border-radius: 4px; cursor: move; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Briefvorschau nach DIN 5008 (verkleinert) */
.letter { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px 26px 26px; font-family: Helvetica, Arial, sans-serif; font-size: .82rem; line-height: 1.5; box-shadow: var(--shadow); }
.letter .ret { font-size: .66rem; color: #555; border-bottom: 1px solid #bbb; display: inline-block; margin-bottom: 6px; }
.letter .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; min-height: 6.5em; margin-bottom: 18px; }
.letter .addr { white-space: pre-line; }
.letter .meta { text-align: end; white-space: nowrap; }
.letter .subj { font-weight: 700; margin-bottom: 12px; }
.letter .body { white-space: pre-wrap; overflow-wrap: anywhere; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; }
.kv dt { color: var(--muted); font-size: .86rem; font-weight: 700; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.tot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; }
.tot .g { font-weight: 800; font-size: 1.1rem; border-top: 2px solid var(--ink); padding-top: 6px; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; }
ol.steps { margin: 0; padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 6px; }

.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 22, .55); display: flex; align-items: flex-end; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .card { width: 100%; max-width: 520px; max-height: 85vh; overflow: auto; box-shadow: var(--shadow); }
@media (min-width: 640px) { .modal { align-items: center; } }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet);
  border-radius: 12px; padding: 12px 16px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: sp 0.9s linear infinite; margin: 0 auto; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.viewer img { width: 100%; height: auto; border-radius: 6px; background: #fff; }
.empty { text-align: center; padding: 22px 10px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty svg { width: 46px; height: 46px; color: var(--muted); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

/* Datei-/Kamera-Auslöser: Eingabefeld liegt unsichtbar IM Button (kein display:none – das blockiert iOS-WebViews) */
.pick { position: relative; overflow: hidden; }
.vh { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
/* iOS: gruppierte Listen */
.sec-h { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 4px 0; }
.group { background: var(--sheet); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.cell { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 14px; background: none; border: 0; text-align: start; cursor: pointer; color: var(--ink); position: relative; font-size: 1rem; }
.cell + .cell::before { content: ""; position: absolute; top: 0; inset-inline-start: 52px; inset-inline-end: 0; border-top: 1px solid var(--line); }
.cell.noicon + .cell.noicon::before { inset-inline-start: 14px; }
.cell .ci { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.cell .ci svg { width: 18px; height: 18px; }
.cell .ci.g { background: #8e8e93; } .cell .ci.o { background: var(--warn); } .cell .ci.r { background: var(--stamp); }
.cell .cx { flex: 1; min-width: 0; }
.cell .ct { font-weight: 600; overflow-wrap: anywhere; }
.cell .cs { font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
.cell .cr { color: var(--muted); font-size: .9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cell .chev { color: var(--line); font-size: 1.3rem; line-height: 1; }
[dir="rtl"] .cell .chev { transform: scaleX(-1); }
.cell:active { background: var(--paper); }
.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
details.cell-d > summary { list-style: none; }
details.cell-d > summary::-webkit-details-marker { display: none; }
details.cell-d .dbody { padding: 0 14px 14px 56px; color: var(--ink); font-size: .95rem; }
[dir="rtl"] details.cell-d .dbody { padding: 0 56px 14px 14px; }

/* Segment-Steuerung */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 38px; font-weight: 600; font-size: .9rem; color: var(--ink); cursor: pointer; padding: 4px 6px; }
.seg button[aria-pressed="true"] { background: var(--sheet); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

/* Wizard-Schritte */
.wsteps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.wstep { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600; color: var(--muted); padding: 2px; }
.wstep b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); color: var(--muted); font-size: .9rem; background: var(--sheet); }
.wstep.done b { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.wstep[aria-current="step"] b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wstep[aria-current="step"] { color: var(--ink); }

/* Hero: nächste Frist */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border: 0; text-align: start; width: 100%; }
.hero .hl { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; opacity: .85; font-weight: 700; }
.hero .ht { font-size: 1.2rem; font-weight: 700; }
.hero .hd { font-size: .95rem; opacity: .92; font-variant-numeric: tabular-nums; }
.hero.red { background: var(--stamp); color: #fff; }
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qa button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; color: var(--ink); text-align: center; padding: 0; }
.qa i { width: 54px; height: 54px; border-radius: 15px; background: var(--sheet); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); }
.qa i svg { width: 26px; height: 26px; }
.tab.scan { position: relative; }
.tab.scan .sb { width: 56px; height: 56px; margin-top: -22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); border: 4px solid var(--sheet); }
.tab.scan .sb svg { width: 26px; height: 26px; }
.gear { border: 0; background: none; color: var(--accent); width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.gear svg { width: 24px; height: 24px; }
table.pos { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
table.pos th, table.pos td { text-align: start; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.pos .r { text-align: end; white-space: nowrap; }
.tscroll { overflow-x: auto; }

/* Oberfläche 06.11.2026: ruhige Startseite (Scan · Fristen · Zuletzt), schmale Demo-Zeile, wischbare Chips */
.company { margin: 0 4px; font-weight: 600; }
.scanhero { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; border-radius: 16px; padding: 18px 16px; background: var(--accent); color: var(--accent-ink); cursor: pointer; text-align: start; box-shadow: var(--shadow); }
.scanhero .si { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.scanhero .si svg { width: 28px; height: 28px; }
.scanhero .st { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.scanhero b { font-size: 1.15rem; }
.scanhero small { font-size: .86rem; opacity: .9; line-height: 1.3; }
.scanhero .chev { font-size: 1.6rem; opacity: .8; }
.scanhero:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sec-h.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; }

    if (!ok) { const e = new Error('conflict'); e.conflict = true; throw e; }
  }
  const current = await store.one(col, rec.id);
  if (current && (current.version || 0) !== (rec.version || 0)) {
    const e = new Error('conflict'); e.conflict = true; e.current = current; throw e;
  }
  const next = Object.assign({}, rec, { version: (rec.version || 0) + 1, updated_at: nowIso() });
  addHistory(next, current ? 'changed' : 'created', note);
  await store.put(col, next);
  return next;
}

  const list = S[listName];
  const i = list.findIndex((x) => x.id === rec.id);

  await reloadAll().catch((e) => { console.error(e); S.loadError = true; });

const MAX_PAGES = 50, MAX_BYTES = 25 * 1024 * 1024;
async function loadDraft() {
  if (S.scan) return S.scan;

  let dr = null; try { dr = await store.one('meta', 'draft'); } catch (e) { console.warn(e); }

  const items = (dr && dr.items) || (p.draft && p.draft.items) || [];
  S.scan = { items, open: true, restored: !!items.length };

}
async function persistDraft() {
  const p = S.profile || (S.profile = { company_name: '', industry: 'sonstiges', language: lang, created_at: nowIso() });
  await store.put('meta', { id: 'draft', items: S.scan.items, updated_at: nowIso() });

}
function draftProblem(items) {
  if (items.some((i) => i.kind === 'xml') && items.length > 1) return 'scan.xmlAlone';
  if (items.reduce((s, i) => s + (i.kind === 'xml' ? 1 : 1), 0) > MAX_PAGES) return 'scan.limitPages';
  if (items.reduce((s, i) => s + (i.size || 0), 0) > MAX_BYTES) return 'scan.limitSize';
  return null;
}
/** Bild → JPEG-Seite, klein genug für die Ablage (< 240 KB als Text) */
function canvasToPage(canvas) {
  let w = canvas.width, h = canvas.height, q = 0.62;
  const maxSide = 1500;
  let scale = Math.min(1, maxSide / Math.max(w, h));
  for (let attempt = 0; attempt < 6; attempt++) {
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(canvas, 0, 0, c.width, c.height);
    const d = c.toDataURL('image/jpeg', q);
    if (d.length < 240000) return { dataUrl: d, w: c.width, h: c.height };
    scale *= 0.82; q = Math.max(0.45, q - 0.05);
  }
  const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return { dataUrl: c.toDataURL('image/jpeg', 0.45), w: c.width, h: c.height };
}
const isImageFile = (f) => (f.type || '').startsWith('image/') || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name || '');
function loadImage(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const img = new Image(); img.onload = () => res(img); img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); }; img.src = u; });
}
async function addPageFromCanvas(canvas, name, size) {
  const pg = canvasToPage(canvas);
  const id = uid();
  await store.put('pages', { id, docId: 'draft', idx: 0, dataUrl: pg.dataUrl, w: pg.w, h: pg.h });
  S.scan.items.push({ id, kind: 'page', name, size: size || pg.dataUrl.length * 0.75, thumb: thumbOf(canvas) });
}
function thumbOf(canvas) {
  const c = document.createElement('canvas'); const s = 90 / Math.max(canvas.width, canvas.height);
  c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.5);
}
async function importFiles(files) {
  S.busy = t('scan.processing'); render();
  try {
    for (const f of files) {
      const n = f.name.toLowerCase();
      if (n.endsWith('.xml') || f.type.includes('xml')) {
        const text = await f.text(); const id = uid();
        await store.put('pages', { id, docId: 'draft', idx: 0, xml: text.slice(0, 200000) });
        S.scan.items.push({ id, kind: 'xml', name: f.name, size: f.size });
      } else if (n.endsWith('.pdf') || f.type === 'application/pdf') {
        S.busy = t('web.pdfRender'); render();
        try {
          if (!window.pdfjsLib) throw new Error('pdf.js');
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
          const per = f.size / pdf.numPages;
          const zx = await zugferdXml(pdf);
          const firstIdx = S.scan.items.length;
          for (let i = 1; i <= pdf.numPages && S.scan.items.length < MAX_PAGES + 1; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 1.6 });
            const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
            await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
            await addPageFromCanvas(c, `${f.name} · ${i}`, per);
          }
          if (zx && S.scan.items[firstIdx]) {
            const pg = await store.one('pages', S.scan.items[firstIdx].id);
            if (pg) { pg.zugferd = zx.slice(0, 200000); await store.put('pages', pg); S.scan.items[firstIdx].name += ' · E-Rechnung'; }
          }
        } catch (e) { console.error(e); toast(t('web.pdfFail')); }
      } else if (isImageFile(f)) {
        const img = await loadImage(f);
        const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        await addPageFromCanvas(c, f.name, f.size);
      } else toast(`${f.name}: ${t('scan.unsupported')}`);
    }
    await persistDraft();
  } catch (e) { toast(t('web.saveFailed', { msg: errText(e) })); }
  S.busy = null; render();
}

/* A4-Zuschnitt: Rahmen verschieben und skalieren */
function initCrop(img, file) {
  const ratio = 297 / 210;
  const W = img.naturalWidth, H = img.naturalHeight;
  let fw = W * 0.92, fh = fw * ratio;
  if (fh > H * 0.96) { fh = H * 0.96; fw = fh / ratio; }
  return { img, file, ratio, scale: 1, base: { w: fw, h: fh }, x: (W - fw) / 2, y: (H - fh) / 2 };
}
function renderCrop() {
  return `<div class="card"><h2>${esc(t('web.cropTitle'))}</h2><p class="muted">${esc(t('web.cropHint'))}</p>
    <div class="crop" id="cropBox"><canvas id="cropCv"></canvas><div class="frame" id="cropFr" tabindex="0" aria-label="A4"></div></div>
    <label class="f" for="cropSz">${esc(t('web.frameSize'))}<input type="range" id="cropSz" min="30" max="100" value="${Math.round(S.crop.scale * 100)}"></label>
    <button class="btn" data-a="cropUse">${esc(t('web.useCrop'))}</button>
    <button class="btn sec" data-a="cropFull">${esc(t('web.useFull'))}</button>
    <button class="btn ghost" data-a="cropCancel">${esc(t('common.cancel'))}</button></div>`;
}
function cropAfter() {
  const cr = S.crop, cv = $('#cropCv'), fr = $('#cropFr'), box = $('#cropBox');
  const W = cr.img.naturalWidth, H = cr.img.naturalHeight;
  const disp = Math.min(1, 1400 / Math.max(W, H));
  cv.width = Math.round(W * disp); cv.height = Math.round(H * disp);
  cv.getContext('2d').drawImage(cr.img, 0, 0, cv.width, cv.height);
  const place = () => {
    const k = box.clientWidth / W;
    const fw = cr.base.w * cr.scale, fh = cr.base.h * cr.scale;
    cr.x = Math.max(0, Math.min(W - fw, cr.x)); cr.y = Math.max(0, Math.min(H - fh, cr.y));
    Object.assign(fr.style, { left: cr.x * k + 'px', top: cr.y * k + 'px', width: fw * k + 'px', height: fh * k + 'px' });
  };
  requestAnimationFrame(place);
  $('#cropSz').oninput = (e) => {
    const old = { w: cr.base.w * cr.scale, h: cr.base.h * cr.scale };
    cr.scale = Number(e.target.value) / 100;
    cr.x += (old.w - cr.base.w * cr.scale) / 2; cr.y += (old.h - cr.base.h * cr.scale) / 2; place();
  };
  let drag = null;
  fr.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, ox: cr.x, oy: cr.y }; fr.setPointerCapture(e.pointerId); };
  fr.onpointermove = (e) => { if (!drag) return; const k = box.clientWidth / W; cr.x = drag.ox + (e.clientX - drag.x) / k; cr.y = drag.oy + (e.clientY - drag.y) / k; place(); };
  fr.onpointerup = fr.onpointercancel = () => { drag = null; };
  fr.onkeydown = (e) => { const s = W * 0.02; if (e.key === 'ArrowLeft') cr.x -= s; else if (e.key === 'ArrowRight') cr.x += s; else if (e.key === 'ArrowUp') cr.y -= s; else if (e.key === 'ArrowDown') cr.y += s; else return; e.preventDefault(); place(); };
}
async function useCrop(full) {

function xKids(el, name) { return el ? [...el.children].filter((c) => c.localName === name) : []; }

    const tx = xFirst(root, 'SupplyChainTradeTransaction');
    const agr = xFirst(tx, 'ApplicableHeaderTradeAgreement');

    const party = (p) => { const a = xFirst(p, 'PostalTradeAddress'); return { name: xText(p, 'Name'), address: addr([xText(p, 'Name'), xText(a, 'LineOne'), xText(a, 'LineTwo'), [xText(a, 'PostcodeCode'), xText(a, 'CityName')].filter(Boolean).join(' '), xText(a, 'CountryID') !== 'DE' ? xText(a, 'CountryID') : '']), vat: xText(p, 'SpecifiedTaxRegistration', 'ID') }; };
    const seller = party(xFirst(agr, 'SellerTradeParty')), buyer = party(xFirst(agr, 'BuyerTradeParty'));
    const sum = xFirst(set, 'SpecifiedTradeSettlementHeaderMonetarySummation');
    const taxes = xPath(set, 'ApplicableTradeTax').map((tt) => ({ rate: xNum(tt, 'RateApplicablePercent'), net: xNum(tt, 'BasisAmount'), vat: xNum(tt, 'CalculatedAmount') }));
    const taxTotal = xPath(sum, 'TaxTotalAmount').map((n) => Number(n.textContent)).find((n) => !isNaN(n));
    const lines = xPath(tx, 'IncludedSupplyChainTradeLineItem').map((li) => ({
      name: xText(li, 'SpecifiedTradeProduct', 'Name'), qty: xNum(li, 'SpecifiedLineTradeDelivery', 'BilledQuantity'),
      price: xNum(li, 'SpecifiedLineTradeAgreement', 'NetPriceProductTradePrice', 'ChargeAmount'),
      rate: xNum(li, 'SpecifiedLineTradeSettlement', 'ApplicableTradeTax', 'RateApplicablePercent'),
      net: xNum(li, 'SpecifiedLineTradeSettlement', 'SpecifiedTradeSettlementLineMonetarySummation', 'LineTotalAmount'),
    }));
    return {
      format: 'ZUGFeRD/Factur-X/XRechnung (CII)', number: xText(root, 'ExchangedDocument', 'ID'),
      issue_date: ciiDate(xText(root, 'ExchangedDocument', 'IssueDateTime', 'DateTimeString')),
      due_date: ciiDate(xText(set, 'SpecifiedTradePaymentTerms', 'DueDateDateTime', 'DateTimeString')),
      currency: xText(set, 'InvoiceCurrencyCode') || 'EUR', seller, buyer,
      iban: xText(set, 'SpecifiedTradeSettlementPaymentMeans', 'PayeePartyCreditorFinancialAccount', 'IBANID'),
      bic: xText(set, 'SpecifiedTradeSettlementPaymentMeans', 'PayeeSpecifiedCreditorFinancialInstitution', 'BICID'),
      reference: xText(set, 'PaymentReference'),
      net: xNum(sum, 'TaxBasisTotalAmount'), vat: taxTotal ?? null, gross: xNum(sum, 'GrandTotalAmount'), payable: xNum(sum, 'DuePayableAmount'),
      taxes, lines, type: xText(root, 'ExchangedDocument', 'TypeCode'),

      return { name, address: addr([name, xText(a, 'StreetName'), xText(a, 'AdditionalStreetName'), [xText(a, 'PostalZone'), xText(a, 'CityName')].filter(Boolean).join(' '), (xText(a, 'Country', 'IdentificationCode') || 'DE') !== 'DE' ? xText(a, 'Country', 'IdentificationCode') : '']), vat: xText(pp, 'PartyTaxScheme', 'CompanyID') }; };
    const tot = xFirst(root, 'LegalMonetaryTotal');
    const taxTotal = xFirst(root, 'TaxTotal');
    const lineName = root.localName === 'Invoice' ? 'InvoiceLine' : 'CreditNoteLine';
    const qtyName = root.localName === 'Invoice' ? 'InvoicedQuantity' : 'CreditedQuantity';
    return {
      format: 'XRechnung (UBL)', number: xText(root, 'ID'), issue_date: parseDate(xText(root, 'IssueDate')),
      due_date: parseDate(xText(root, 'DueDate')) || parseDate(xText(root, 'PaymentMeans', 'PaymentDueDate')),
      currency: xText(root, 'DocumentCurrencyCode') || 'EUR', seller: party(xFirst(root, 'AccountingSupplierParty')), buyer: party(xFirst(root, 'AccountingCustomerParty')),
      iban: xText(root, 'PaymentMeans', 'PayeeFinancialAccount', 'ID'), bic: xText(root, 'PaymentMeans', 'PayeeFinancialAccount', 'FinancialInstitutionBranch', 'ID'),
      reference: xText(root, 'PaymentMeans', 'PaymentID'),
      net: xNum(tot, 'TaxExclusiveAmount'), vat: xNum(taxTotal, 'TaxAmount'), gross: xNum(tot, 'TaxInclusiveAmount'), payable: xNum(tot, 'PayableAmount'),
      taxes: xPath(taxTotal, 'TaxSubtotal').map((x) => ({ rate: xNum(x, 'TaxCategory', 'Percent'), net: xNum(x, 'TaxableAmount'), vat: xNum(x, 'TaxAmount') })),

}

const LETTER_FIELDS = [['sender', 'reply.sender', 1], ['recipient', 'reply.recipient', 1], ['place_date', 'reply.placeDate'], ['subject', 'reply.subject'], ['salutation', 'reply.salutation'], ['body', 'reply.body', 2], ['closing', 'reply.closing'], ['signature', 'reply.signature']];
function addrLines(s) { const out = []; for (const raw of String(s || '').split(/\r?\n/)) { const l = raw.trim(); if (l && !out.some((o) => o.toLowerCase() === l.toLowerCase())) out.push(l); } return out; }
/** Betreff inkl. Bezug/Zeichen (ältere Entwürfe hatten ein eigenes Feld „Bezug“) */
function letterSubject(L) {
  const s = String(L.subject || '').trim(), r = String(L.reference || '').trim();
  if (!r || s.toLowerCase().includes(r.toLowerCase())) return s;
  return s ? `${s} – ${r}` : r;
}
function letterText(L) {
  return [addrLines(L.sender).join('\n'), '', addrLines(L.recipient).join('\n'), '', L.place_date, '', letterSubject(L), '', L.salutation, '', String(L.body || '').trim(), '', '', L.closing, '', '', '', L.signature].join('\n').replace(/\n{4,}(?=\S)/g, (m) => m);
}
function letterMail(L) { return [L.salutation, '', String(L.body || '').trim(), '', '', L.closing, '', '', '', L.signature].join('\n'); }
function letterPdf(L) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
  const left = 25, width = 165, lh = 5;
  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(7); pdf.text(addrLines(L.sender).join(' · '), left, 48, { maxWidth: 85 });
  pdf.setFontSize(10.5);
  const rl = addrLines(L.recipient).slice(0, 9);
  let y = 55; for (const l of rl) { pdf.text(l, left, y, { maxWidth: 85 }); y += lh; }
  // „Ort, Datum“ rechts, auf Höhe der letzten Anschriftzeile (PLZ Ort)
  if (L.place_date) pdf.text(String(L.place_date), 190, 55 + Math.max(0, rl.length - 1) * lh, { align: 'right', maxWidth: 70 });
  y = Math.max(103.4, y + 2 * lh); pdf.setFont('helvetica', 'bold'); for (const l of pdf.splitTextToSize(letterSubject(L), width)) { pdf.text(l, left, y); y += lh; }
  pdf.setFont('helvetica', 'normal'); y += lh;
  const lines = [L.salutation, '', ...String(L.body || '').trim().split('\n'), '', '', L.closing, '', '', '', L.signature];
  for (const para of lines) {
    const wrapped = para ? pdf.splitTextToSize(para, width) : [''];
    for (const l of wrapped) { if (y > 280) { pdf.addPage(); y = 25; } pdf.text(l, left, y); y += lh; }
  }

}

function icsEscape(v) { return String(v || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) { const out = []; let l = line; while (l.length > 74) { out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); }
function buildIcs(ids, fixedDays) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//eOffis//Fristen//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:eOffis Fristen'];
  for (const x of S.tasks.filter((k) => k.status !== 'done' && k.due_date && (!ids || ids.includes(k.id)))) {
    const d = x.due_date.replace(/-/g, ''), e = addDays(x.due_date, 1).replace(/-/g, '');
    lines.push('BEGIN:VEVENT', `UID:${x.id}@eoffis`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${e}`,
      icsFold(`SUMMARY:${icsEscape('eOffis: ' + x.title)}`), icsFold(`DESCRIPTION:${icsEscape(t('tasks.kind_' + x.kind) + (x.notes ? ' – ' + x.notes : ''))}`), 'TRANSP:TRANSPARENT');
    for (const n of [...new Set(fixedDays || offsetsFor(x.kind))].sort((a, b) => b - a)) {
      // Ganztägiger Termin beginnt 00:00 – Erinnerung jeweils um 9 Uhr am Tag „n Tage vorher“
      const trig = n === 0 ? 'PT9H' : n === 1 ? '-PT15H' : `-P${n - 1}DT15H`;
      lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `TRIGGER:${trig}`, icsFold(`DESCRIPTION:${icsEscape(x.title)}`), 'END:VALARM');
    }
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}

/** Eigene Steuerregel: ab erstem Monat im Intervall, Tag X, Versatz in Monaten, Wochenende/Feiertage (bundesweit + eigene) → nächster Werktag */
function ruleDates(R, from, months) {
  const own = new Set(R.holidays.split(/[\s,;]+/).map(parseDate).filter(Boolean));
  const step = R.interval === 'monthly' ? 1 : R.interval === 'quarterly' ? 3 : 12;
  const start = fromISO(from), end = new Date(start.getFullYear(), start.getMonth() + months, start.getDate()), out = [];
  for (let y = start.getFullYear() - 1; y <= end.getFullYear(); y++) {
    for (let m = R.first; m <= 12; m += step) {
      const tm = new Date(y, m - 1 + R.offset, 1);
      tm.setDate(Math.min(R.day, new Date(tm.getFullYear(), tm.getMonth() + 1, 0).getDate()));
      let iso = toISO(tm);
      for (let n = 0; n < 30 && ((R.weekend && !isWorkday(iso)) || own.has(iso)); n++) iso = addDays(iso, 1);
      if (iso >= from && fromISO(iso) < end && !out.includes(iso)) out.push(iso);
    }
  }
  return out.sort();
}

function invTotals(items) {
  const by = new Map(); let net = 0;
  for (const it of items) { const l = Math.round(it.qty * it.unit_price * 100) / 100; net += l; by.set(it.vat_rate, (by.get(it.vat_rate) || 0) + l); }
  const vat_lines = [...by.entries()].sort((a, b) => a[0] - b[0]).map(([rate, n]) => ({ rate, net: Math.round(n * 100) / 100, vat: Math.round(n * rate) / 100 }));
  net = Math.round(net * 100) / 100; const vat = Math.round(vat_lines.reduce((s, v) => s + v.vat, 0) * 100) / 100;
  return { net, vat, gross: Math.round((net + vat) * 100) / 100, vat_lines };
}
function invState(inv) {
  if (inv.is_template) return { label: 'template', color: 'grey', open: 0, overdue: false };
  if (inv.status !== 'final') return { label: 'draft', color: 'grey', open: 0, overdue: false };
  const paid = (inv.payments || []).reduce((s, p) => s + p.amount, 0);
  const open = Math.round((inv.snapshot.gross - paid) * 100) / 100;
  if (open <= 0.005) return { label: 'paid', color: 'green', open: 0, overdue: false };
  const overdue = daysUntil(inv.snapshot.due_date) < 0;
  return { label: overdue ? 'overdue' : 'open', color: overdue ? 'red' : 'orange', open, overdue };
}

const near = (a, b) => Math.abs(a - b) < 0.01;
const mentions = (p, ref) => !!ref && String(p || '').replace(/\s/g, '').toLowerCase().includes(String(ref).replace(/\s/g, '').toLowerCase());
const normName = (v) => String(v || '').toLocaleLowerCase('de-DE').replace(/[^\p{L}\p{N}]/gu, '');
/** Punktesystem wie im Abgleich: Betrag (auch Skonto) 2, Rechnungsnummer im Verwendungszweck 4, Name 2 */
function candidatesFor(tx) {
  const amt = Math.abs(tx.amount);
  if (tx.amount < 0) {
    return S.docs.filter((d) => !d.paid && (d.is_incoming_invoice || d.payment_required) && d.amount_gross != null && !/gutschrift|lieferschein/i.test(d.doc_type || '')).map((d) => {
      const full = near(d.amount_gross, amt);
      const disc = d.discount_percent > 0 && d.discount_date && tx.date <= d.discount_date && Math.abs(Math.round(d.amount_gross * (100 - d.discount_percent)) / 100 - amt) <= 0.011;
      const ref = (d.invoice_number || '').length >= 3 && mentions(tx.purpose, d.invoice_number);
      const sn = normName((d.sender || '').split(/[\n,]/)[0]), rn = normName(tx.counterparty);
      const name = sn.length >= 4 && rn.length >= 4 && (sn.includes(rn) || rn.includes(sn));
      return { type: 'doc', id: d.id, score: (full || disc ? 2 : 0) + (ref ? 4 : 0) + (name ? 2 : 0), disc };
    }).filter((c) => c.score >= 2).sort((x, y) => y.score - x.score);
  }
  const idx = openInvIndex(), purpose = String(tx.purpose || '').replace(/\s/g, '').toLowerCase(), cp = normName(tx.counterparty);
  return idx.map(({ i, open, num, nm }) => {
    const ref = !!num && purpose.includes(num), amtOk = near(open, amt) || near(i.snapshot.gross, amt);
    const name = nm.length >= 4 && cp.includes(nm.slice(0, 12));
    return { type: 'inv', id: i.id, open, score: (amtOk ? 2 : 0) + (ref ? 4 : 0) + (name ? 2 : 0) };
  }).filter((c) => c.score >= 2).sort((x, y) => y.score - x.score);
}
let INV_IDX = null;
/** Offene Rechnungen einmal je Abgleich vorbereiten (statt je Buchung neu zu rechnen) */
function openInvIndex() {
  if (INV_IDX) return INV_IDX;
  return S.invoices.filter((i) => i.status === 'final').map((i) => ({ i, open: invState(i).open })).filter((x) => x.open > 0)
    .map((x) => Object.assign(x, { num: String(x.i.number || '').replace(/\s/g, '').toLowerCase(), nm: normName(x.i.snapshot.customer_name) }));
}
function matchTx(txs) {
  INV_IDX = null; INV_IDX = openInvIndex();
  try { return matchTxInner(txs); } finally { INV_IDX = null; }
}
function matchTxInner(txs) {
  const used = new Set();
  return txs.map((tx) => {
    const best = candidatesFor(tx).find((c) => !used.has(c.id));
    if (best) { used.add(best.id); return Object.assign({ tx }, best, { auto: true }); }
    return { tx, type: null };
  });
}

      for (let i = 1; i <= pdf.numPages && out.length < 20; i++) { const pg = await pdf.getPage(i); const vp = pg.getViewport({ scale: 1.6 }); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; out.push(c); }
    } else { const img = await loadImage(f); const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); out.push(c); }

}

    case 'exOne': a.checked ? S.exSel.add(v) : S.exSel.delete(v); return render();
    case 'exZip': return exportZip();
    case 'exPdf': return guard(async () => { S.exBusy = true; render(); try { const docs = S.docs.filter((x) => S.exSel.has(x.id) && x.page_count && x.tax_flag !== 'deadline'); const blob = await sortedPdf(docs); S.exBusy = false; render(); await saveFile(`eOffis_Belege_sortiert_${todayISO()}.pdf`, blob); } finally { S.exBusy = false; render(); } });
    case 'exTab': S.exTab = v; return render();
    case 'dvSkr': { readDatev(); const P = S.datevP; const d0 = datevDefaults(P.skr), d1 = datevDefaults(v); if (P.revenue7.account === d0.r7) P.revenue7.account = d1.r7; if (P.revenue19.account === d0.r19) P.revenue19.account = d1.r19; P.skr = v; return render(); }
    case 'dvSaveP': return guard(async () => { readDatev(); S.profile = Object.assign({}, S.profile, { datev: clone(S.datevP) }); await store.setProfile(S.profile); toast(t('web.toastSaved')); render(); });
    case 'dvRange': { readDatev(); const f = parseDate(val('dv_from')), to = parseDate(val('dv_to')); if (!f || !to) return toast(t('common.invalidDate')); S.datevX.from = f; S.datevX.to = to; S.datevX.sel = {}; return render(); }
    case 'dvSel': { readDatev(); const inv = S.invoices.find((x) => x.id === v); if (a.checked) S.datevX.sel[v] = { debtor: knownDebtor(inv.snapshot.customer_name) || '1' + '0'.repeat(S.datevP.accountLength), taxDate: inv.snapshot.issue_date }; else delete S.datevX.sel[v]; return render(); }
    case 'dvAll': { readDatev(); const X = S.datevX; const finals = S.invoices.filter((x) => x.status === 'final' && x.snapshot.issue_date >= X.from && x.snapshot.issue_date <= X.to); if (a.checked) { for (const inv of finals) if (!X.sel[inv.id]) X.sel[inv.id] = { debtor: knownDebtor(inv.snapshot.customer_name) || '1' + '0'.repeat(S.datevP.accountLength), taxDate: inv.snapshot.issue_date }; } else X.sel = {}; return render(); }
    case 'dvExport': return guard(async () => {
      readDatev(); const P = S.datevP, X = S.datevX;
      const entries = Object.entries(X.sel).map(([id, e]) => ({ inv: S.invoices.find((x) => x.id === id), debtor: e.debtor, taxDate: e.taxDate }));
      X.problems = datevProblems(P, X.from, X.to, entries); if (X.problems.length) return render();
      const csv = buildDatev(P, X.from, X.to, entries); const bytes = cp1252(csv); const hash = await sha256(csv);
      // Jeder Stapel als eigenes Dokument; CSV nur, solange es unter der Dokumentgrenze bleibt (sonst wird es aus den Rechnungen neu erzeugt)
      const batch = { id: 'datev-' + uid(), kind: 'datev', created_at: nowIso(), from: X.from, to: X.to, count: entries.length, hash, P: clone(P), entries: entries.map((e) => [e.inv.id, e.debtor, e.taxDate]) };
      if (csv.length < 150000) batch.csv = csv;
      if (JSON.stringify(batch).length > 240000) delete batch.entries;
      await store.put('meta', batch); (S.datevBatches || (S.datevBatches = [])).push(batch);
      S.profile = Object.assign({}, S.profile, { datev: clone(P) });
      await store.setProfile(S.profile);
      await saveFile(`EXTF_Buchungsstapel_${X.from}_${X.to}.csv`, new Blob([bytes], { type: 'text/csv' }));
      S.datevX.sel = {}; render();
    });
    case 'dvAgain': { const b = S.datevBatches[i]; let csv = b.csv; if (!csv && b.entries) csv = buildDatev(b.P || S.datevP, b.from, b.to, b.entries.map(([id, debtor, taxDate]) => ({ inv: S.invoices.find((x) => x.id === id), debtor, taxDate })).filter((e) => e.inv)); if (!csv) return toast(t('common.error')); return saveFile(`EXTF_Buchungsstapel_${b.from}_${b.to}.csv`, new Blob([cp1252(csv)], { type: 'text/csv' })); }
    case 'fwPdf': { const docs = S.docs.filter((x) => S.exSel.has(x.id) && x.tax_flag === 'deadline' && x.page_count); for (const x of docs) { const pages = (await store.where('pages', 'docId', x.id)).sort((p1, p2) => p1.idx - p2.idx); if (x.file_kind === 'xml') await saveFile(`${safeName(x.title)}.xml`, (pages[0] && pages[0].xml) || ''); else await saveFile(`${safeName(x.title)}.pdf`, pagesToPdf(pages)); } return; }
    case 'fwText': return copy(forwardText(S.docs.filter((x) => S.exSel.has(x.id) && x.tax_flag === 'deadline')));
    case 'taskCycle': return guard(async () => { const x = S.tasks.find((k) => k.id === v); const nx = { open: 'in_progress', in_progress: 'done', done: 'open' }[x.status] || 'open'; const saved = await saveVersioned('tasks', Object.assign({}, x, { status: nx }), t('tasks.status_' + nx)); S.tasks[S.tasks.findIndex((k) => k.id === v)] = saved; await spawnNext(saved); render(); });
    case 'taskSeg': S.showDone = v === 'done'; return render();
    case 'calAdd': { const ids = (S.docUi && S.docUi.calIds) || []; if (!ids.length) return; return saveFile(`eOffis_Fristen_${(d && (d.sender || d.title) || 'Beleg').replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g, '_').slice(0, 40)}.ics`, buildIcs(ids, [7, 1])).then(() => toast(t('web.calDone'))); }
    case 'calNo': if (S.docUi) S.docUi.calDismissed = true; return render();
    case 'icsExport': return saveFile(`eOffis_Fristen_${todayISO()}.ics`, buildIcs());
    case 'remInApp': return guard(async () => { S.profile = Object.assign({}, S.profile, { reminders: Object.assign(remCfg(), { inApp: a.checked }) }); await store.setProfile(S.profile); render(); });
    case 'remSet': return guard(async () => { const rc = remCfg(); const n = +v; const k = a.dataset.k; const list = rc[k].includes(n) ? rc[k].filter((x) => x !== n) : rc[k].concat([n]); if (!list.length) return; rc[k] = list.sort((x, y) => y - x); S.profile = Object.assign({}, S.profile, { reminders: rc }); await store.setProfile(S.profile); render(); });
    case 'docStep': S.docUi = Object.assign({}, S.docUi, { step: +v }); render(); window.scrollTo(0, 0); return;
    case 'toggleFields': S.docUi.fieldsOpen = !S.docUi.fieldsOpen; return render();
    case 'todoTask': return guard(async () => { const text = (d.suggested_task && !(d.next_steps || []).includes(d.suggested_task) ? [d.suggested_task] : []).concat(d.next_steps || [])[i]; const rec = { id: uid(), document_id: d.id, title: text, kind: /zahl|überweis|bezahl/i.test(text) ? 'payment' : /antwort|schreib/i.test(text) ? 'reply' : 'other', due_date: d.due_date || null, status: 'open', priority: 'normal', notes: d.title, created_at: nowIso(), version: 0 }; const saved = await saveVersioned('tasks', rec); S.tasks.push(saved); toast(t('web.taskMade')); render(); });
    case 'replyGo': S.replyUi = { step: 'questions', kind: v, questions: null, answers: {} }; go('reply', { id: d.id }); return replyStart();
    case 'docChecked': return guard(async () => { await persistDoc(d, a.checked ? { status: 'reviewed', reviewed_at: nowIso() } : { status: 'saved', reviewed_at: null }, t('web.checked')); render(); });
    case 'erTake': return erTake();
    case 'docService': return guard(async () => { await persistDoc(d, { service_received: v }, t('web.service')); render(); });
    case 'setLang': return guard(async () => { setLang(v); if (S.profile) { S.profile = Object.assign({}, S.profile, { language: v }); await store.setProfile(S.profile); } render(); });
    case 'setInd': S.setInd = v; document.querySelectorAll('[data-a="setInd"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v)); return;
    case 'settingsSave': return guard(async () => {
      const p = Object.assign({}, S.profile || {}, {
        company_name: val('st_name').trim(), industry: S.setInd || (S.profile && S.profile.industry) || 'sonstiges',
        street: val('st_street').trim(), zip: val('st_zip').trim(), city: val('st_city').trim(), email: val('st_email').trim(), contact: val('st_contact').trim(), phone: val('st_phone').trim(),
        address: [val('st_name').trim(), val('st_street').trim(), [val('st_zip').trim(), val('st_city').trim()].filter(Boolean).join(' ')].filter(Boolean).join('\n'),
        tax_number: val('st_tax').trim(), vat_id: val('st_vat').trim(), iban: val('st_iban').replace(/\s+/g, '').toUpperCase(),
        invoice_prefix: val('st_prefix').trim() || 'RE-', tax_advisor_email: val('st_mail').trim() || null,
      });
      if (p.iban && !ibanValid(p.iban)) toast(t('settings.iban') + ' ✗'); else if (p.vat_id && !vatIdValid(p.vat_id)) toast(t('settings.vatId') + ' ✗');
      await store.setProfile(p); S.profile = p; S.setInd = null; if ((!p.iban || ibanValid(p.iban)) && (!p.vat_id || vatIdValid(p.vat_id))) toast(t('web.toastSaved')); render();
    });
  }
});

boot();

</script>
